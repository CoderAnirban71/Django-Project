{% extends "layout.html" %}

{% block title %}
{% endblock %}

{% block content %}
<h1 class="text-center mt-4">Welcome to Paradox</h1>

<h2> {%if form.instance.pk %} 
    Edit Tweet 
    {% else %} 
    Create Tweet 
    {% endif %} 
    <form method="post" enctype="multipart/form-data" class="form">
        {% csrf_token %}
        {{form.as_p}}
        <button class="btn btn-warning fw-bold" type="submit" >Submit</button>
    </form>
    <a href="{% url 'tweet_list' %}">back to Tweet List</a>
</h2>

{% endblock %}
